name = "basis-round-robin"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Created via `wrangler kv namespace create RR_KV` (prints an id to put
# below), or bind it in the Cloudflare dashboard under this Worker's
# Settings > Bindings > KV Namespace (either works; the dashboard binding
# is what actually takes effect once deployed either way).
# [[kv_namespaces]]
# binding = "RR_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
